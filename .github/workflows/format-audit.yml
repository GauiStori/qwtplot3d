name: Formatting audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: Qt C++ style
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format

      - name: Check C++ formatting
        run: |
          find include src examples \
            -type f \( -name '*.h' -o -name '*.cpp' \) \
            -print0 \
            | xargs -0 clang-format --dry-run --Werror

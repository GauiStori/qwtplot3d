name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Qt 5 backends
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgles-dev \
            libglu1-mesa-dev \
            libqt5opengl5-dev \
            qtbase5-dev \
            zlib1g-dev

      - name: Configure
        run: |
          mkdir build-desktop
          cd build-desktop
          qmake -qt=5 ../qwtplot3d.pro

      - name: Build desktop OpenGL
        working-directory: build-desktop
        run: make --jobs="$(nproc)"

      - name: Check desktop library
        working-directory: build-desktop
        run: |
          test -e lib/libqwtplot3d-qt5.so.0.2.7
          readelf --dynamic lib/libqwtplot3d-qt5.so.0.2.7 | grep NEEDED

      - name: Configure and build GLES
        run: |
          mkdir build-gles
          cd build-gles
          qmake -qt=5 CONFIG+=gles ../qwtplot3d.pro
          make --jobs="$(nproc)"

      - name: Check GLES library
        working-directory: build-gles
        run: |
          test -e lib/libqwtplot3d-qt5.so.0.2.7
          readelf --dynamic lib/libqwtplot3d-qt5.so.0.2.7 | grep NEEDED
          if readelf --dynamic lib/libqwtplot3d-qt5.so.0.2.7 \
              | grep NEEDED \
              | grep -E 'libGL(U)?\.so|libQt5OpenGL'; then
            echo "The GLES library has a direct desktop OpenGL dependency."
            exit 1
          fi

      - name: Run core tests
        run: |
          mkdir build-tests
          cd build-tests
          qmake -qt=5 ../tests/core_tests.pro
          make --jobs="$(nproc)"
          ./qwtplot3d-core-tests

      - name: Run core tests with GLES
        run: |
          mkdir build-tests-gles
          cd build-tests-gles
          qmake -qt=5 CONFIG+=gles ../tests/core_tests.pro
          make --jobs="$(nproc)"
          ./qwtplot3d-core-tests

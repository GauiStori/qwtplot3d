name: Raspberry Pi OS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armhf:
    name: Raspberry Pi OS 32-bit / Qt 5 / GLES 1
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Build in Raspberry Pi OS
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite:latest
          cpu: arm1176
          image_additional_mb: 2048
          commands: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
              build-essential \
              libgles-dev \
              qtbase5-dev \
              zlib1g-dev
            qmake CONFIG+=gles qwtplot3d.pro
            make --jobs=2
            test -e lib/libqwtplot3d-qt5.so.0.2.7
            readelf --dynamic lib/libqwtplot3d-qt5.so.0.2.7 | grep NEEDED
            if readelf --dynamic lib/libqwtplot3d-qt5.so.0.2.7 \
                | grep NEEDED \
                | grep -E 'libGL(U)?\.so|libQt5OpenGL'; then
              echo "The Raspberry Pi OS build has a direct desktop OpenGL dependency."
              exit 1
            fi
